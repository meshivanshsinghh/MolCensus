# MolCensus configuration. Relative paths are resolved from the repository root,
# so the same file works on any machine. Environment variables like ${BIOMINER_DIR}
# are expanded at load time (put them in .env, see .env.example).

paths:
  pdf_dir: data/pdfs                                              # 1.pdf, 2.pdf, 4.pdf, 6.pdf, 16.pdf, 19.pdf
  ground_truth_csv: data/ground_truth_SMILES_confirmed_1_2_4_6_16_19.csv
  work_dir: outputs/work                                          # page images and crops (not committed)
  models_dir: models                                              # downloaded weights (not committed)
  results_dir: results                                            # metrics, predictions, figures (committed)
  public_data_dir: data/public                                    # downloaded public benchmark images (not committed)

# Course benchmark papers with curated ground truth (222 molecules in total).
papers: [1, 2, 4, 6, 16, 19]

render:
  dpi: 300                  # high enough to keep small atom labels readable in the crops

detection:
  method: moldet            # "moldet" = MolDetV2 YOLO detector on page images (BioMiner's detector)
                            # "embedded" = fallback that pulls raster images out of the PDF, no model needed
  moldet:
    hf_repo: UniParser/MolDetv2
    weights_file: moldet_v2_yolo11n_960_doc.pt   # document model, the one BioMiner uses
    local_weights: ""       # optional path if the file is already downloaded
    imgsz: 960
    conf_threshold: 0.4
    pad_px: 12              # padding around each box so bonds at the edge are not cut off
    device: cpu
  embedded:
    min_width: 150          # skip icons, logos and tiny inline images
    min_height: 100

recognizers:
  molscribe:
    enabled: true
    hf_repo: yujieq/MolScribe
    checkpoint_file: swin_base_char_aux_1m680k.pth
    local_checkpoint: ""
    device: cpu
  biominer:
    # End-to-end BioMiner (MinerU + MolDetV2 + MolGlyph + MLLM). Needs one 24 GB GPU in API
    # mode and its three model servers running. Disabled until class HPC access is ready.
    enabled: false
    repo_dir: ${BIOMINER_DIR}
    python_executable: ${BIOMINER_PYTHON}
    config_path: BioMiner/config/default_open_source.yaml    # relative to repo_dir; holds the MLLM API key
    timeout_s: 3600

public_check:
  # Installation check from the 1.1 proposal: does each tool reproduce its published accuracy on
  # public single-molecule images before we trust its score on the course papers?
  hf_repo: yujieq/MolScribe
  archive: real.zip         # 184 MB: CLEF, UOB, USPTO, Staker and ACS images with SMILES (MIT-licensed repo)
  datasets: [uspto, acs]    # USPTO = patent drawings; ACS = journal figures, the closest match to the course papers
  sample_size: 300          # images per dataset, as a fixed random sample (0 = all); keeps the CPU run short
  seed: 0
  published_exact:          # MolScribe exact-match accuracy reported by Qian et al. (2023)
    uspto: 0.926
    acs: 0.719

scoring:
  fingerprint_radius: 2     # Morgan fingerprint settings for Tanimoto similarity
  fingerprint_bits: 2048
  near_match_threshold: 0.85  # Tanimoto at or above this counts as a near match
  bootstrap_rounds: 2000    # resamples for the paper-level bootstrap interval
  seed: 0
