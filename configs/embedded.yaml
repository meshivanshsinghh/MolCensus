# Same run as default.yaml, except that molecules come from the images embedded in each PDF
# instead of MolDetV2 detections. Comparing the two runs shows what detection alone changes.
extends: default.yaml

paths:
  work_dir: outputs/work_embedded
  results_dir: results/embedded_detection

detection:
  method: embedded

public_check: null  # does not depend on the detector, so it is not repeated here
