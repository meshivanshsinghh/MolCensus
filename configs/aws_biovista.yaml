# Stage c of scripts/aws/run_all.sh: BioMiner on BioVista papers, named <index>_<pdb id>.pdf as
# BioMiner's evaluator expects. Gemini on Vertex AI, as for the course papers.
extends: aws.yaml

paths:
  pdf_dir: data/biovista/pdfs
  work_dir: outputs/work_biovista
  results_dir: results/aws_biovista

recognizers:
  biominer:
    extra_args: ${BIOMINER_EXTRA_ARGS}   # run_all.sh sets --biovista_evaluate when BioVista's labels are there
