# Run on the GPU instance by scripts/aws/run_all.sh. Which tools run is chosen there with --tools.
# The ground truth is a header-only placeholder, so the private file never leaves the Mac; the
# instance only predicts. Score on the Mac with configs/aws_score.yaml.
extends: default.yaml

# Gemini key tier for the course papers: paid or free. Stage d and the smoke test before it both use
# BioMiner/config/molcensus_<tier>.yaml, so the smoke test checks the key stage d will use. If you
# switch to free, also change the Scope line in ~/COURSE_PDFS_PERMISSION_GIVEN to match.
course_tier: paid

paths:
  ground_truth_csv: scripts/aws/placeholder_ground_truth.csv
  results_dir: results/aws          # kept apart from the committed Mac results

recognizers:
  molscribe:
    device: cuda
  molsight:
    device: cuda
  molglyph:
    device: cuda
  biominer: {}                      # its config comes from course_tier above; stage d needs the permission flag

public_check:
  datasets: [uspto, uob, clef, acs, biovista]
  sample_size: 0                    # every image
