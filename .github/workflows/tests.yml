name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Only what the scoring tests need. The MolScribe test skips itself when MolScribe is absent.
      - run: pip install "numpy<2" "pandas>=2.0,<3" pyyaml rdkit pytest
      - run: pytest -q
